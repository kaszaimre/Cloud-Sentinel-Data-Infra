<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Borsodi Bajnok - Harcmező Pro v2.0</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #020617; color: #f1f5f9; font-family: monospace; }
        canvas { background: #0f172a; border: 4px solid #06b6d4; box-shadow: 0 0 30px rgba(6, 182, 212, 0.3); border-radius: 8px; }
        #ui { position: absolute; top: 20px; left: 20px; font-size: 18px; pointer-events: none; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div id="ui">
        💰 TOKEN: <span id="score" style="color: #f59e0b; font-weight: bold;">0</span> | 
        ⚡ SZINT: <span id="level" style="color: #06b6d4; font-weight: bold;">1</span> | 
        🛡️ PAJZS: <span id="shield" style="color: #10b981; font-weight: bold;">INAKTÍV</span> |
        🚨 STÁTUSZ: <span id="status" style="color: #22c55e;">KÜLDETÉS ALATT</span>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const shieldEl = document.getElementById('shield');
        const statusEl = document.getElementById('status');

        canvas.width = 700; canvas.height = 500;

        let score = 0, level = 1, isBoosted = false;
        let player = { x: 50, y: 50, size: 24, speed: 5 };
        let enemies = [{ x: 500, y: 300, size: 24, speed: 1.8 }];
        let items = Array.from({ length: 5 }, () => ({ x: 100 + Math.random() * 550, y: 100 + Math.random() * 350, size: 10 }));
        let boosts = [{ x: Math.random() * 650, y: Math.random() * 450, size: 12 }];
        
        // A Mozozdíthatatlan Monolit Falak
        let walls = [
            { x: 200, y: 150, w: 150, h: 25 }, 
            { x: 450, y: 200, w: 25, h: 150 }
        ];

        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        // Golyóálló AABB Fal-ütközés detektáló algoritmus (The Shiled Logic)
        function checkWallCollision(newX, newY) {
            for (let w of walls) {
                if (newX < w.x + w.w && newX + player.size > w.x &&
                    newY < w.y + w.h && newY + player.size > w.y) {
                    return true; // Ütközés van, a barázda lezárva!
                }
            }
            return false;
        }

        function update() {
            // JAVÍTVA: A Boost sebesség most már minden irányba golyóállóan pörög!
            let currentSpeed = isBoosted ? player.speed * 1.8 : player.speed;
            
            let nextX = player.x;
            let nextY = player.y;

            if (keys['ArrowUp'] && player.y > 0) nextY -= currentSpeed;
            if (keys['ArrowDown'] && player.y < canvas.height - player.size) nextY += currentSpeed;
            if (keys['ArrowLeft'] && player.x > 0) nextX -= currentSpeed;
            if (keys['ArrowRight'] && player.x < canvas.width - player.size) nextX += currentSpeed;

            // Csak akkor lépünk, ha nem megyünk neki a nehéz tölgyfa falnak!
            if (!checkWallCollision(nextX, player.y)) player.x = nextX;
            if (!checkWallCollision(player.x, nextY)) player.y = nextY;

            // Szintek és nehézség kalibrálása a 150 script alapján
            level = Math.floor(score / 50) + 1;
            levelEl.innerText = level;
            while(enemies.length < level) {
                enemies.push({ x: Math.random()*600, y: Math.random()*400, size: 24, speed: 1.2 + (level*0.2) });
            }

            // Ellenségek (A Mátrix Robotjai) intelligens követési algoritmusa
            enemies.forEach(en => {
                if (en.x < player.x) en.x += en.speed;
                else if (en.x > player.x) en.x -= en.speed;
                if (en.y < player.y) en.y += en.speed;
                else if (en.y > player.y) en.y -= en.speed;

                // Ütközés a hacker robotokkal
                if (Math.abs(player.x - en.x) < 20 && Math.abs(player.y - en.y) < 20) {
                    statusEl.innerText = "🚨 ADATKAMPÓ! HACKER TÁMADÁS!";
                    statusEl.style.color = "#e11d48";
                    score = Math.max(0, score - 1);
                    scoreEl.innerText = score;
                }
            });

            // Tárgyak (Tokenzsákok) begyűjtése
            items.forEach((item, i) => {
                if (Math.hypot((player.x + player.size/2) - item.x, (player.y + player.size/2) - item.y) < 24) {
                    items.splice(i, 1);
                    score += 10;
                    scoreEl.innerText = score;
                    statusEl.innerText = "💰 RECOGNITION: TOKEN BEGYŰJTVE!";
                    statusEl.style.color = "#22c55e";
                    items.push({ x: 50 + Math.random() * 600, y: 50 + Math.random() * 400, size: 10 });
                }
            });

            // Firewall Boost Pajzs aktiválása
            boosts.forEach((b, i) => {
                if (Math.hypot((player.x + player.size/2) - b.x, (player.y + player.size/2) - b.y) < 24) {
                    boosts.splice(i, 1);
                    isBoosted = true;
                    shieldEl.innerText = "AKTÍV (TURBÓ)";
                    shieldEl.style.color = "#06b6d4";
                    setTimeout(() => {
                        isBoosted = false;
                        shieldEl.innerText = "INAKTÍV";
                        shieldEl.style.color = "#10b981";
                    }, 5000);
                    // Újraélesztjük a pajzs-bogyót valahol máshol
                    setTimeout(() => boosts.push({ x: Math.random() * 650, y: Math.random() * 450, size: 12 }), 7000);
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Falak kirajzolása (Vállalati Tűzfal betonelemek)
            ctx.fillStyle = '#334155';
            walls.forEach(w => {
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.strokeStyle = '#475569';
                ctx.strokeRect(w.x, w.y, w.w, w.h);
            });

            // 2. Játékos kirajzolása (Don Főnök Emoji-módban 👨)
            ctx.font = "24px Arial";
            ctx.textBaseline = "top";
            ctx.fillText("👨", player.x, player.y);
            
            // Ha boost van, kap egy szép kiber-aurát a grafikustól
            if (isBoosted) {
                ctx.strokeStyle = '#06b6d4';
                ctx.strokeRect(player.x - 2, player.y - 2, player.size + 4, player.size + 4);
            }

            // 3. Ellenségek kirajzolása (Mátrix Robotok 🤖)
            enemies.forEach(en => {
                ctx.fillText("🤖", en.x, en.y);
            });

            // 4. Tárgyak kirajzolása (Nyers Profit Tokenek 💰)
            items.forEach(it => {
                ctx.fillText("💰", it.x - 10, it.y - 10);
            });

            // 5. Firewall Boost kirajzolása (Pajzs bástya 🛡️)
            boosts.forEach(b => {
                ctx.fillText("🛡️", b.x - 12, b.y - 12);
            });
        }

        // JAVÍTVA: A Játékhurok tiszta szétválasztása az elcsúszás ellen
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Start Hadművelet!
        gameLoop();
    </script>
</body>
</html>
